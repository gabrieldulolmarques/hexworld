services:
  # --- Sockets mode (default) ---
  server:
    init: true
    build: ./server
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/hexworld.db
      SERVER_ADDRESS: 0.0.0.0:5000
      PYTHONUNBUFFERED: 1
    volumes:
      - ./server:/app
    networks:
      hexworld:
        ipv4_address: 10.1.0.2

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - server
    networks:
      hexworld:
        ipv4_address: 10.1.0.3

  # --- RMI mode (docker compose --profile rmi up --build) ---
  name-server:
    profiles: [rmi]
    build: ./server
    command: python -m Pyro5.nameserver --host 0.0.0.0 --port 9090
    ports:
      - "9090:9090"
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      hexworld:
        ipv4_address: 10.1.0.4

  server-rmi:
    profiles: [rmi]
    init: true
    build: ./server
    environment:
      DATABASE_PATH: /app/data/hexworld.db
      HEXWORLD_TRANSPORT: rmi
      PYRO_NS_HOST: 10.1.0.4
      PYRO_NS_PORT: "9090"
      PYRO_HOST: 10.1.0.5
      PYTHONUNBUFFERED: 1
    volumes:
      - ./server:/app
    depends_on:
      - name-server
    networks:
      hexworld:
        ipv4_address: 10.1.0.5

networks:
  hexworld:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
