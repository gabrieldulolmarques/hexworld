services:
  name-server:
    build: ./server
    network_mode: host
    command: python -m Pyro5.nameserver --host 127.0.0.1 --port 9090
    environment:
      PYTHONUNBUFFERED: 1

  server-rmi:
    init: true
    build: ./server
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_PATH: /app/data/hexworld.db
      PYRO_NS_HOST: 127.0.0.1
      PYRO_HOST: 127.0.0.1
      PYTHONUNBUFFERED: 1
    volumes:
      - ./server:/app
    depends_on:
      - name-server
